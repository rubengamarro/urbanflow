[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "urbanflow-ai"
version = "1.0.0"
description = "Reproducible NYC taxi demand forecasting with temporal evaluation and MLOps"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=18,<22",
  "scikit-learn>=1.5,<1.8", "xgboost>=2.1,<4", "mlflow>=3.1,<4",
  "prefect>=3.1,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "streamlit>=1.40,<2",
  "plotly>=5.24,<7", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "joblib>=1.4,<2", "matplotlib>=3.9,<4", "typer>=0.12,<1",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.5", "setuptools>=70,<81"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<7"]

[project.scripts]
urbanflow = "urbanflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".venv", "data", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["spark: requires Java and the spark extra", "postgres: requires DATABASE_URL"]
